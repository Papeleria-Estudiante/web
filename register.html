<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="registro-container">
        <h1>Registrarse</h1>
        <form id="registerForm">
            <label for="nombre_usuario">Nombre de usuario:</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" required>

            <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a></p>
        <div id="mensaje"></div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                nombre_usuario: form.nombre_usuario.value,
                correo: form.correo.value,
                contraseña: form.contraseña.value
                // No enviamos rol, será automático en el backend
            };

            try {
                const response = await fetch('http://localhost:3000/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    mensaje.style.color = 'green';
                    mensaje.textContent = 'Usuario registrado exitosamente.';
                    form.reset();
                } else {
                    mensaje.style.color = 'red';
                    mensaje.textContent = result.error || 'Error al registrar usuario.';
                }
            } catch (error) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Error de conexión con el servidor.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
